name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: Runner to use
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
          - local

permissions:
  contents: read

jobs:
  prototype:
    name: Prototype checks
    runs-on: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.runner == 'local' && '["self-hosted","merchant-globe"]') || (github.event_name == 'workflow_dispatch' && inputs.runner == 'linux' && '["ubuntu-latest"]') || '["windows-latest"]') }}
    timeout-minutes: 15

    defaults:
      run:
        working-directory: prototype/web-v0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show runner environment
        run: |
          python -c "import os, platform; print('Runner:', os.getenv('RUNNER_NAME')); print('OS:', os.getenv('RUNNER_OS')); print('Arch:', os.getenv('RUNNER_ARCH')); print('Platform:', platform.platform())"
          node --version
          python --version

      - name: Check JavaScript syntax
        run: |
          node --check game-core.js
          node --check app.js

      - name: Run economy tests
        run: npm test

      - name: Run 100-game balance simulation
        run: npm run simulate:ci

      - name: Check Python server syntax
        run: python -m py_compile server.py

      - name: Smoke test development server
        run: python tests/smoke_test.py
